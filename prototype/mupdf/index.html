<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linden Leaf · MuPDF 原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae3;color:#34392f;font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#faf8f3;border-bottom:1px solid #d5d4c7;padding:14px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0 auto 0 0}button,input{font:inherit}button{border:1px solid #babfae;background:#fffdf7;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{background:#e6ecd9}input[type=number]{width:62px}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100vh - 72px)}#reader{overflow:auto;padding:24px}#sheet{position:relative;margin:auto;background:white;box-shadow:0 3px 20px #0002}canvas{display:block}#overlay{position:absolute;inset:0;touch-action:none;cursor:text}aside{overflow:auto;padding:20px;background:#f8f6f0;border-left:1px solid #d5d4c7}h2{font-size:15px}#selection{white-space:pre-wrap;line-height:1.7;min-height:70px;overflow-wrap:anywhere}.note{padding:12px;margin:12px 0;background:#fff;border-left:3px solid #9fa96b;line-height:1.6}.note button{display:block;margin-top:8px}#status{font-size:12px;color:#6c7261;margin-top:15px}#message{color:#a34535;white-space:pre-wrap}.hint{font-size:13px;line-height:1.7;color:#747b67}@media(max-width:800px){main{grid-template-columns:1fr}aside{max-height:35vh}}
</style><header><h1 id="title">Linden Leaf · MuPDF 原型</h1><button id="prev">上一页</button><label><input id="page" type="number" min="1" value="1"> / <span id="total">—</span></label><button id="next">下一页</button><label>缩放 <input id="zoom" type="range" min="0.5" max="3" step="0.25" value="1"><span id="zoomValue">100%</span></label><button id="rotate">旋转 90°</button></header>
<main><section id="reader"><div id="sheet"><canvas id="image"></canvas><canvas id="overlay"></canvas></div></section><aside><h2>选中文字</h2><p class="hint">拖动选择文字。保存的高亮会跟随页面缩放和旋转，刷新后仍然保留。</p><div id="selection"></div><button id="copy">复制</button> <button id="save">保存高亮</button><h2>本页高亮</h2><div id="notes"></div><p id="status"></p><p id="message"></p></aside></main>
<script type="module">
const $=id=>document.getElementById(id), image=$('image'), overlay=$('overlay');
const dpr=window.devicePixelRatio||1;
let page=0, rotation=0, meta=null, info, selected=null, start=null, notes=[], renderId=0, selectId=0, busy=false, pending=null, zoomTimer;
async function request(url){const r=await fetch(url);if(!r.ok)throw new Error((await r.json()).error);return r}
function message(e){$('message').textContent=e.message||String(e)}
function key(){return 'linden-mupdf-prototype:'+info.bookId}
function drawQuads(ctx,quads,color){ctx.fillStyle=color;for(const q of quads){ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2],q[3]);ctx.lineTo(q[6],q[7]);ctx.lineTo(q[4],q[5]);ctx.closePath();ctx.fill()}}
function paint(){const c=overlay.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,overlay.width,overlay.height);if(!meta)return;c.setTransform(...meta.matrix);c.translate(0,0);for(const n of notes)if(n.page===page)drawQuads(c,n.quads,'rgba(220,178,37,.32)');if(selected)drawQuads(c,selected.quads,'rgba(58,126,215,.30)')}
function showNotes(){$('notes').replaceChildren();for(const n of notes.filter(n=>n.page===page)){const el=document.createElement('div');el.className='note';el.textContent=n.text;const del=document.createElement('button');del.textContent='删除';del.onclick=()=>{notes=notes.filter(x=>x.id!==n.id);localStorage.setItem(key(),JSON.stringify(notes));showNotes();paint()};el.append(del);$('notes').append(el)}}
async function render(){const id=++renderId;++selectId;pending=null;start=null;selected=null;meta=null;$('selection').textContent='';$('message').textContent='';page=Math.max(0,Math.min(info.pages-1,page));$('page').value=page+1;const scale=Number($('zoom').value);$('zoomValue').textContent=Math.round(scale*100)+'%';
const t=performance.now();const r=await request(`/render?page=${page}&scale=${scale*dpr}&rotation=${rotation}`);const b=await r.arrayBuffer();if(id!==renderId)return;const length=new DataView(b).getUint32(0,true);meta=JSON.parse(new TextDecoder().decode(new Uint8Array(b,4,length)));for(const c of [image,overlay]){c.width=meta.width;c.height=meta.height;c.style.width=meta.width/dpr+'px';c.style.height=meta.height/dpr+'px'}$('sheet').style.width=meta.width/dpr+'px';$('sheet').style.height=meta.height/dpr+'px';image.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(b,4+length),meta.width,meta.height),0,0);paint();showNotes();$('status').textContent=`本次显示 ${Math.round(performance.now()-t)} ms · 页面生成 ${meta.nativeMs} ms`;}
function point(e){const r=overlay.getBoundingClientRect();return new DOMPoint((e.clientX-r.left)*overlay.width/r.width+meta.x,(e.clientY-r.top)*overlay.height/r.height+meta.y).matrixTransform(new DOMMatrix(meta.matrix).inverse())}
async function drain(){if(busy)return;busy=true;try{while(pending){const job=pending;pending=null;const q=new URLSearchParams({page:job.page,ax:job.a.x,ay:job.a.y,bx:job.b.x,by:job.b.y});const result=await (await request('/select?'+q)).json();if(job.id===selectId&&job.render===renderId){selected=result;$('selection').textContent=result.text;paint()}}}catch(e){message(e)}finally{busy=false}}
function selectionTo(e){if(!start||!meta)return;pending={a:start,b:point(e),page,id:++selectId,render:renderId};void drain()}
overlay.onpointerdown=e=>{if(!meta)return;start=point(e);overlay.setPointerCapture(e.pointerId);selectionTo(e)};overlay.onpointermove=e=>{if(start)selectionTo(e)};overlay.onpointerup=e=>{selectionTo(e);start=null};overlay.onpointercancel=()=>{start=null};
$('copy').onclick=()=>{if(selected?.text)navigator.clipboard.writeText(selected.text).catch(message)};
$('save').onclick=()=>{if(!selected?.text)return;notes.push({id:crypto.randomUUID(),page,text:selected.text,quads:selected.quads});localStorage.setItem(key(),JSON.stringify(notes));selected=null;$('selection').textContent='';showNotes();paint()};
function refresh(){render().catch(message)}$('prev').onclick=()=>{page--;refresh()};$('next').onclick=()=>{page++;refresh()};$('page').onchange=()=>{const n=Number($('page').value);if(Number.isInteger(n)){page=n-1;refresh()}};$('rotate').onclick=()=>{rotation=(rotation+90)%360;refresh()};$('zoom').oninput=()=>{clearTimeout(zoomTimer);zoomTimer=setTimeout(refresh,100)};
try{info=await(await request('/info')).json();$('title').textContent=info.title+' · MuPDF 原型';$('total').textContent=info.pages;$('page').max=info.pages;notes=JSON.parse(localStorage.getItem(key())||'[]');await render()}catch(e){message(e)}
</script></html>
